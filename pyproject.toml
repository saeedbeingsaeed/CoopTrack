[project]
name = "cooptrack"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not e2e'"
markers = ["e2e: end-to-end tests in a real browser (pytest -m e2e)"]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:No directory at:UserWarning",
]
