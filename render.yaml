# Render Blueprint: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: cooptrack
    runtime: python
    plan: free
    region: ohio
    buildCommand: ./build.sh
    # gunicorn binds to $PORT, which Render provides. Two workers fit in 512 MB.
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Supabase session pooler URI in the dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false # shown on the privacy page
      - key: ADZUNA_APP_ID
        sync: false # from developer.adzuna.com; without it Find jobs shows sample postings
      - key: ADZUNA_APP_KEY
        sync: false
      - key: TIME_ZONE
        value: America/Toronto
